name: build-images

# 镜像在 GitHub Actions 构建并推送到 GHCR，生产服务器只 pull 不 build（遵守部署规则 12）
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算版本号
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "owner=$OWNER_LC" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "构建版本：$VERSION"

      - name: 构建并推送应用镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/lyh-ai:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/lyh-ai:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 构建并推送运维工具镜像（迁移与灌数据）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.tools
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/lyh-ai-tools:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/lyh-ai-tools:latest
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools

      - name: 输出摘要
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo "- 应用：\`ghcr.io/${{ steps.meta.outputs.owner }}/lyh-ai:${{ steps.meta.outputs.version }}\`"
            echo "- 工具：\`ghcr.io/${{ steps.meta.outputs.owner }}/lyh-ai-tools:${{ steps.meta.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
